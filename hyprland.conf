
############################
# MONITORS CONFIGURATION  #
############################

# Автоматическое определение монитора с предпочтительным режимом
monitor=,preferred,auto,auto

############################
# APPLICATION VARIABLES   #
############################

# Основные приложения
$terminal = kitty
$fileManager = nautilus 
$menu = wofi --show drun



############################
# AUTOSTART APPLICATIONS #
############################

# Панель состояния
exec-once = waybar 

# Восстановление обоев
exec-once=waypaper --restore

# Демон для анимированных обоев
exec-once = swww-daemon
# Проверка автоочистки при запуске (запускается и завершается)
# exec-once = auto-clean-check



############################
# ENVIRONMENT VARIABLES   #
############################

# Размер курсора
env = XCURSOR_SIZE,12
# env = XCURSOR_THEME,heart-text-cursor
cursor{
  no_warps = false
  hide_on_key_press = true
}

############################
# LOOK AND FEEL           #
############################

# Цветовая схема из pywal
source= /home/via/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 2.5
    gaps_out = 5
    border_size = 0

    col.active_border = $color0
    col.inactive_border = $color0

    resize_on_border = false 
    allow_tearing = false
    layout = scrolling
}

decoration {
    rounding =  0
    # Прозрачность окон
    active_opacity = 1
    inactive_opacity = 1 

    shadow {
        enabled = false
        range = 5
        render_power = 4
        offset = 8, 8
        scale = 2 
    }

    blur {
        enabled = true
        size = 8
        passes = 0
        vibrancy = 0.1696
    }
}



############################
# ANIMATIONS              #
############################

animations {
    enabled = true

    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, smooth
    animation = windowsIn, 1, 5, smooth, popin
    animation = windowsOut, 1, 5, smooth, popin
    animation = border, 1, 5, smooth
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 5, smooth
}

############################
# WINDOW LAYOUTS          #
############################

dwindle {
#    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}



############################
# MISC SETTINGS           #
############################

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
}



############################
# INPUT SETTINGS          #
############################

input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_space_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    
    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



############################
# KEYBINDINGS             #
############################

$mainMod = ALT

# Захват устройства ввода (evtest)
bind = $mainMod, K, exec, sudo evtest --grab /dev/input/eventX
bind = $mainMod, K, exec, sudo evtest --grab --release /dev/input/eventX

# Запуск приложений
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod,R,exec,pkill -x wofi || wofi &
bind = $mainMod, P, exec, project-launcher

# Управление окнами
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod,F,fullscreen
bind = $mainMod SHIFT, M, exit,

# Dwindle-режим
bind = $mainMod, P, pseudo,
#bind = $mainMod, J, togglesplit,

# Фокус окон
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# bindc = $mainMod, SPACE , alterzorder, top, active

# Переключение рабочих столов
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Перемещение окон между рабочими столами
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Скролл рабочих столов
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Перемещение и изменение размера окон мышью
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow



############################
# MULTIMEDIA KEYS         #
############################

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



############################
# UTILITIES               #
############################

# Скриншот выделенной области
bind = $mainMod,Tab,exec,grim -g "$(slurp)" ~/Pictures/screenshots/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png

# Перезапуск waybar
bind = $mainMod,B,exec,pkill -x waybar || waybar &

# Night light (Москва)
bind = $mainMod,g,exec,pkill -x hyprsunset; hyprsunset -t 3000 



# Color picker с автокопированием
bind = $mainMod,C,exec,hyprpicker -a | wl-copy

